# Local development database only. Production uses a managed Postgres (Supabase) with pgvector.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: alactic
      POSTGRES_PASSWORD: alactic_dev_password
      POSTGRES_DB: alactic
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - alactic_pg:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alactic -d alactic"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  alactic_pg:
